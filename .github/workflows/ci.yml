name: AquaCart Continuous Integration

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

# Least privilege for GITHUB_TOKEN. Without this block the token inherits the
# repository default, which on many repos is read/write on every scope — a
# compromised dependency running during `npm install` or the build could then
# push commits or publish releases. This job only ever needs to read the code.
permissions:
  contents: read

# A new push to a branch makes the in-flight run for that branch obsolete;
# cancelling it frees a runner instead of leaving a stale job holding a token.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        # `npm ci` installs exactly what package-lock.json pins and fails if the
        # lockfile and manifest disagree. `npm install` silently resolves new
        # versions, so a compromised transitive release could land in CI
        # without any change in the repo.
        run: npm ci --include=dev

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify TypeScript compilation
        run: npm run typecheck

      - name: Execute Automated Unit Tests
        run: npm run test

      - name: Compile Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DATABASE_URL: "mysql://mock:mock@localhost:3306/mock"
