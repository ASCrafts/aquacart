[build]
  command = "npm run build"

[build.environment]
  # These values end up in compiled output by design (NEXT_PUBLIC_* is
  # exposed to the client bundle; the others are non-sensitive config read
  # at module scope) and are not secrets, so exclude them from Netlify's
  # secrets scanner. Real secrets (DATABASE_URL, NEXTAUTH_SECRET, API keys,
  # etc.) remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "AUTH_URL,WSS_PORT,EMAIL_SERVER_HOST,NEXT_PUBLIC_WSS_URL,NEXT_PUBLIC_APP_URL"

# Cache-Control headers. Netlify applies the most specific matching rule, so
# the immutable static rule below wins over the catch-all for hashed assets.

# Force the browser to revalidate the HTML document on every load so new
# deployments (env/DB fixes, etc.) are picked up without a manual cache clear.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Authenticated pages must not be stored by the CDN or the browser at all.
# Netlify applies the most specific matching rule, so these win over the
# catch-all above. This mirrors the `no-store` rules in next.config.ts so the
# guarantee holds whether a response is rendered by Next or served from the
# edge — it is what stops a signed-in page being replayed from a shared cache.
[[headers]]
  for = "/account/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"

[[headers]]
  for = "/cart"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"

[[headers]]
  for = "/order-success/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"

# Content-hashed build assets never change for a given URL — cache forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be served stale, or update detection breaks.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Workbox runtime chunks are content-hashed; safe to cache long-term.
[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The product catalogue is public, read-only data served from Next's data
# cache and busted on every write. Letting the CDN hold it for a minute keeps
# the header's search typeahead instant without ever going stale for long.
# Scoped deliberately: every other /api/* route is per-user and must not cache.
[[headers]]
  for = "/api/products"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=300"

# -----------------------------------------------------------------------------
# Scheduled jobs (R2 short-fall flow + R6 admin nudge + notification drain).
#
# The three jobs live as ordinary Next.js App Router route handlers —
# src/app/api/cron/{shortfall-refunds,undeclared-nudge,drain-notifications}/route.ts
# — guarded by src/lib/cron-auth.ts, which fails closed if CRON_SECRET is
# unset and requires `Authorization: Bearer <CRON_SECRET>` on every call.
#
# Netlify's "experimental-scheduled" route config (`export const config = {
# type: 'experimental-scheduled', schedule }`) only wires up Pages Router API
# routes (pages/api/*.ts default-export handlers); it does not attach to an
# App Router route.ts exporting GET. A schedule can only be attached to a real
# Netlify Function, so the entries below name three functions that are NOT
# part of this task's file list and still need to be added, one per job, as
# e.g. netlify/functions/shortfall-refunds.mts:
#
#   import type { Config } from '@netlify/functions';
#   export default () =>
#     fetch(`${process.env.URL}/api/cron/shortfall-refunds`, {
#       headers: { Authorization: `Bearer ${process.env.CRON_SECRET}` },
#     });
#   export const config: Config = { schedule: '*/15 * * * *' };
#
# Cron fires in UTC, but every job measures IST via business-day.ts internally
# (elapsed minutes, never the wall clock), so the frequency below is the only
# thing that matters — not which UTC minute it lands on.
[functions."shortfall-refunds"]
  # shortfall-refunds tests the 08:00 IST DEADLINE on each run, not the
  # current hour, so a missed invocation catches up silently on the next one
  # instead of losing a morning's refunds. See that route's own doc comment.
  schedule = "*/15 * * * *"

[functions."undeclared-nudge"]
  # Same reasoning: it no-ops before elapsed 05:00 IST and again once today's
  # dedupeKey exists, so polling it every 15 minutes costs nothing extra.
  schedule = "*/15 * * * *"

[functions."drain-notifications"]
  # The queue's own claim lease is 5 minutes (LEASE_MS in that route), so
  # draining more often than that would only contend with itself.
  schedule = "*/5 * * * *"
